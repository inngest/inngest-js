name: Release

on:
  # Changeset-powered releases
  push:
    branches:
      - main
      - "v*.x"

  # Label-powered prereleases
  pull_request:
    types: [labeled, opened, reopened, synchronize]

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          # Used to fetch all history so that changesets doesn't attempt to
          # publish duplicate tags.
          fetch-depth: 0
      # Replaces `concurrency` - never cancels any jobs
      - uses: softprops/turnstyle@v1
        with:
          poll-interval-seconds: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-and-build
      - run: node scripts/generateReleaseConfig.js
        env:
          BRANCH: ${{ github.ref_name }}
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm run release:version
          publish: pnpm run release:all
          title: ${{ github.ref_name == 'main' && 'Release @latest' || format('Release {0}', github.ref_name) }}
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESET_GITHUB_TOKEN }}
          NODE_ENV: test # disable npm access checks; they don't work in CI
          BRANCH: ${{ github.ref_name }}

  generate-prerelease-matrix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'

          MATRIX=$(jq -n --arg labels "$LABELS" '
            ($labels | fromjson) as $labelList |
            [
              {package: "inngest", dist_dir: "dist"},
              {package: "eslint-plugin"},
              {package: "middleware-sentry"},
              {package: "middleware-encryption", dist_dir: "dist"},
              {package: "test"},
              {package: "ai"},
              {package: "realtime", dist_dir: "dist"},
              {package: "otel", dist_dir: "dist"},
              {package: "ci", dist_dir: "dist"},
              {package: "middleware-validation", dist_dir: "dist"}
            ] | map(. as $pkg | select($labelList | index("prerelease/" + $pkg.package)))
          ')

          echo "matrix=$(jq -cn --argjson data "$MATRIX" '{include: $data}')" >> $GITHUB_OUTPUT

  prereleases:
    needs: generate-prerelease-matrix
    concurrency: prerelease-${{ github.ref }}
    continue-on-error: true
    strategy:
      matrix: ${{ fromJson(needs.generate-prerelease-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-and-build
        with:
          install-dependencies: true
          build: ${{ matrix.package == 'inngest' || matrix.package == 'ci' }}

      - run: pnpm build
        if: matrix.package != 'inngest'

      - run: pnpm run test
        if: matrix.package == 'otel'

      - name: Determine prerelease tag
        id: prerelease-tag
        working-directory: .
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          FALLBACK_TAG="pr-${{ github.event.pull_request.number }}"

          # Collect every "prerelease-tag/<tag>" label (stripping the prefix),
          # sorted so that if more than one is present we pick deterministically
          # (the alphabetically-first one) rather than relying on label ordering.
          TAG_CANDIDATES=$(jq -n --arg labels "$LABELS" '
            ($labels | fromjson)
            | map(select(startswith("prerelease-tag/")) | sub("^prerelease-tag/"; ""))
            | sort
          ')

          CANDIDATE_COUNT=$(jq 'length' <<< "$TAG_CANDIDATES")
          CHOSEN_RAW=$(jq -r '.[0] // ""' <<< "$TAG_CANDIDATES")

          if [[ -z "$CHOSEN_RAW" ]]; then
            TAG="$FALLBACK_TAG"
          else
            if [[ "$CANDIDATE_COUNT" -gt 1 ]]; then
              echo "::notice::Multiple prerelease-tag/* labels found ($(jq -c . <<< "$TAG_CANDIDATES")); using '$CHOSEN_RAW' (alphabetically first)."
            fi

            # Sanitise into something npm will accept as a dist-tag: lowercase
            # alphanumerics and hyphens only, collapsing anything else, and
            # trimming leading/trailing hyphens.
            SANITISED=$(echo "$CHOSEN_RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//')

            # Reject empty results, and anything that could be read as a
            # version number (npm forbids a dist-tag that is a valid semver).
            if [[ -z "$SANITISED" ]] || [[ "$SANITISED" =~ ^[0-9]+(-[0-9]+){0,2}$ ]]; then
              echo "::warning::prerelease-tag label 'prerelease-tag/${CHOSEN_RAW}' sanitised to an invalid dist-tag ('${SANITISED}'); falling back to ${FALLBACK_TAG}"
              TAG="$FALLBACK_TAG"
            else
              TAG="$SANITISED"
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Prerelease PR
        run: |
          export TAG=${{ steps.prerelease-tag.outputs.tag }}
          export NODE_ENV=test
          [[ -n "${{ matrix.dist_dir }}" ]] && export DIST_DIR=${{ matrix.dist_dir }}
          node ../../scripts/release/prerelease.js

      - name: Update PR with latest prerelease
        uses: edumserrano/find-create-or-update-comment@v1
        with:
          token: ${{ secrets.CHANGESET_GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: "<!-- pr-prerelease-comment-${{ matrix.package }} -->"
          comment-author: "inngest-release-bot"
          edit-mode: "replace"
          body: |
            <!-- pr-prerelease-comment-${{ matrix.package }} -->
            A user has added the <kbd>[prerelease/${{ matrix.package }}](https://github.com/inngest/inngest-js/labels/prerelease%2F${{ matrix.package }})</kbd> label, so this PR will be published to npm with the tag `${{ steps.prerelease-tag.outputs.tag }}`. It will be updated with the latest changes as you push commits to this PR.

            You can install this prerelease version with:

            ```sh
            npm install ${{ matrix.package == 'inngest' && 'inngest' || format('@inngest/{0}', matrix.package) }}@${{ steps.prerelease-tag.outputs.tag }}
            ```

            The last release was built and published from ${{ github.event.pull_request.head.sha }}.
