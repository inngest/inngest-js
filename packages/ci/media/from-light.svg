<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d">
<title id="t">Jobs layered with from()</title>
<desc id="d">Three jobs build on each other: base, build, test. In the first run all three run. In the second run the base key is unchanged so base is restored without running, build has a new key and runs again from the base snapshot, and test runs from the new build snapshot.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker>
</defs>
<rect width="940" height="400" rx="12" fill="#ffffff"/>
<text x="304" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">base</text>
<text x="304" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">files(&quot;pnpm-lock.yaml&quot;)</text>
<text x="570" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">build</text>
<text x="570" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">files(&quot;src/**&quot;)</text>
<text x="836" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">test</text>
<text x="836" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">no cache</text>
<text x="24" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">Run 1</text>
<text x="24" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a" text-anchor="start">First push</text>
<text x="24" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start">Run 2</text>
<text x="24" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a" text-anchor="start">src changed,</text>
<text x="24" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a" text-anchor="start">lockfile same</text>
<rect x="214" y="76" width="180" height="112" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="304" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Built</text>
<text x="304" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#57606a" text-anchor="middle">checkout</text>
<text x="304" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">pnpm install</text>
<rect x="480" y="76" width="180" height="112" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="570" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Built</text>
<text x="570" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#57606a" text-anchor="middle">from(base)</text>
<text x="570" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">pnpm build</text>
<rect x="746" y="76" width="180" height="112" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="836" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Runs</text>
<text x="836" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#57606a" text-anchor="middle">from(build)</text>
<text x="836" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">pnpm test</text>
<path d="M394 132 H476" fill="none" stroke="#8c959f" stroke-width="1.75" marker-end="url(#a)"/>
<text x="437" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">snapshot</text>
<path d="M660 132 H742" fill="none" stroke="#8c959f" stroke-width="1.75" marker-end="url(#a)"/>
<text x="703" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">snapshot</text>
<rect x="214" y="232" width="180" height="112" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="304" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Cache hit</text>
<text x="304" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#57606a" text-anchor="middle">key unchanged</text>
<text x="304" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">no commands run</text>
<rect x="480" y="232" width="180" height="112" rx="8" fill="#fff1e8" stroke="#c2410c" stroke-width="1.5"/>
<text x="570" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#c2410c" text-anchor="middle">Rebuilt</text>
<text x="570" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#57606a" text-anchor="middle">key changed</text>
<text x="570" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">pnpm build</text>
<rect x="746" y="232" width="180" height="112" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="836" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">Runs</text>
<text x="836" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#57606a" text-anchor="middle">from(build)</text>
<text x="836" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">on the new snapshot</text>
<path d="M394 288 H476" fill="none" stroke="#8c959f" stroke-width="1.75" marker-end="url(#a)"/>
<text x="437" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">snapshot</text>
<path d="M660 288 H742" fill="none" stroke="#8c959f" stroke-width="1.75" marker-end="url(#a)"/>
<text x="703" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#57606a" text-anchor="middle">snapshot</text>
<text x="470" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a" text-anchor="middle">A cache hit skips the job and restores its saved machine. A new key reruns that job only.</text>
</svg>
